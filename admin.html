<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Green Mobility - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="max-w-[95%] mx-auto mt-10 bg-white p-6 rounded-lg shadow-md overflow-hidden mb-10">
        <h2 class="text-3xl font-bold text-green-600 mb-6 text-center">Go Green Mobility - Admin Dashboard</h2>
        <div class="overflow-x-auto">
            <table class="w-full border-collapse border border-gray-300 text-xs">
                <thead>
                    <tr class="bg-green-100 text-gray-800">
                        <th class="border border-gray-300 px-2 py-2">नाम (Name)</th>
                        <th class="border border-gray-300 px-2 py-2">मोबाइल</th>
                        <th class="border border-gray-300 px-2 py-2">पार्टनर</th>
                        <th class="border border-gray-300 px-2 py-2">ड्राइविंग लाइसेंस</th>
                        <th class="border border-gray-300 px-2 py-2">आधार नंबर</th>
                        <th class="border border-gray-300 px-2 py-2">पैन नंबर</th>
                        <th class="border border-gray-300 px-2 py-2">गारंटर 1 (नाम / फोन)</th>
                        <th class="border border-gray-300 px-2 py-2">गारंटर 2 (नाम / फोन)</th>
                        <th class="border border-gray-300 px-2 py-2">स्थिति</th>
                        <th class="border border-gray-300 px-2 py-2">स्कूटी नंबर</th>
                        <th class="border border-gray-300 px-2 py-2">कारवाई</th>
                    </tr>
                </thead>
                <tbody id="riderTableBody">
                    <tr><td colspan="11" class="text-center py-4 text-gray-500">Loading data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchRiders() {
            const tbody = document.getElementById('riderTableBody');
            try {
                const response = await fetch(`/api/riders`);
                const result = await response.json();
                const riders = result.data || result;

                if (!riders || riders.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="11" class="text-center py-4 text-gray-500">कोई राइडर उपलब्ध नहीं है।</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                riders.forEach(rider => {
                    const tr = document.createElement('tr');
                    
                    let statusColor = 'text-yellow-600';
                    if (rider.status === 'Approved') statusColor = 'text-green-600';
                    if (rider.status === 'Rejected') statusColor = 'text-red-600';

                    tr.innerHTML = `
                        <td class="border border-gray-300 px-2 py-2 font-medium">${rider.name || '-'}</td>
                        <td class="border border-gray-300 px-2 py-2">${rider.phone || '-'}</td>
                        <td class="border border-gray-200 px-2 py-2 font-semibold text-green-700">${rider.partner || '-'}</td>
                        <td class="border border-gray-300 px-2 py-2">${rider.drivingLicense || '-'}</td>
                        <td class="border border-gray-300 px-2 py-2">${rider.aadhaar || '-'}</td>
                        <td class="border border-gray-300 px-2 py-2 uppercase">${rider.pan || '-'}</td>
                        <td class="border border-gray-300 px-2 py-2">${rider.guarantor1Name || '-'}<br><span class="text-gray-500">${rider.guarantor1Phone || ''}</span></td>
                        <td class="border border-gray-300 px-2 py-2">${rider.guarantor2Name || '-'}<br><span class="text-gray-500">${rider.guarantor2Phone || ''}</span></td>
                        <td class="border border-gray-300 px-2 py-2 font-semibold ${statusColor}">${rider.status || 'Pending'}</td>
                        <td class="border border-gray-300 px-2 py-2">${rider.scooterNumber || 'Not Assigned'}</td>
                        <td class="border border-gray-300 px-2 py-2 text-center space-y-1">
                            ${rider.status === 'Pending' ? `
                                <button onclick="updateRiderStatus('${rider._id}', 'Approved')" class="bg-green-600 text-white px-2 py-1 rounded hover:bg-green-700 text-xs font-medium block w-full">अप्रूव</button>
                                <button onclick="updateRiderStatus('${rider._id}', 'Rejected')" class="bg-red-600 text-white px-2 py-1 rounded hover:bg-red-700 text-xs font-medium block w-full">रिजेक्ट</button>
                            ` : `<span class="text-gray-500 font-medium text-xs">${rider.status}</span>`}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="11" class="text-center py-4 text-red-500">डेटा लोड करने में त्रुटि हुई।</td></tr>`;
            }
        }

        async function updateRiderStatus(id, status) {
            let scooterNumber = 'Not Assigned';
            if (status === 'Approved') {
                scooterNumber = prompt("स्कूटी नंबर दर्ज करें (Enter Scooter Number):", "GGM-SCOOTER-01");
                if (!scooterNumber) return;
            } else {
                if (!confirm("क्या आप वाकई इस राइडर के आवेदन को रिजेक्ट करना चाहते हैं?")) return;
            }

            try {
                const response = await fetch(`/api/update-rider`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, status, scooterNumber })
                });
                if (response.ok) {
                    alert(status === 'Approved' ? "राइडर सफलतापूर्वक अप्रूव कर दिया गया है!" : "राइडर का आवेदन रिजेक्ट कर दिया गया है।");
                    fetchRiders();
                } else {
                    alert("अपडेट करने में विफल रहा।");
                }
            } catch (err) {
                alert("कनेक्शन त्रुटि।");
            }
        }

        fetchRiders();
    </script>
</body>
</html>
