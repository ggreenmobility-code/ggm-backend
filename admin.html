<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Green Mobility - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="max-w-6xl mx-auto mt-10 bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-3xl font-bold text-green-600 mb-6 text-center">Go Green Mobility - Admin Dashboard</h2>
        <div class="overflow-x-auto">
            <table class="w-full border-collapse border border-gray-300">
                <thead>
                    <tr class="bg-green-100">
                        <th class="border border-gray-300 px-4 py-2">नाम (Name)</th>
                        <th class="border border-gray-300 px-4 py-2">मोबाइल (Phone)</th>
                        <th class="border border-gray-300 px-4 py-2">पार्टनर (Partner)</th>
                        <th class="border border-gray-300 px-4 py-2">स्थिति (Status)</th>
                        <th class="border border-gray-300 px-4 py-2">स्कूटी नंबर (Scooter)</th>
                        <th class="border border-gray-300 px-4 py-2">कारवाई (Action)</th>
                    </tr>
                </thead>
                <tbody id="riderTableBody">
                    <tr><td colspan="6" class="text-center py-4 text-gray-500">Loading data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = "https://ggm-backend-77yp.onrender.com";

        async function fetchRiders() {
            const tbody = document.getElementById('riderTableBody');
            try {
                const response = await fetch(`${API_URL}/api/riders`);
                const result = await response.json();
                const riders = result.data || result;

                if (!riders || riders.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-gray-500">कोई राइडर उपलब्ध नहीं है।</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                riders.forEach(rider => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="border border-gray-300 px-4 py-2">${rider.name}</td>
                        <td class="border border-gray-300 px-4 py-2">${rider.phone}</td>
                        <td class="border border-gray-300 px-4 py-2">${rider.partner}</td>
                        <td class="border border-gray-300 px-4 py-2 font-semibold ${rider.status === 'Approved' ? 'text-green-600' : 'text-yellow-600'}">${rider.status || 'Pending'}</td>
                        <td class="border border-gray-300 px-4 py-2">${rider.scooterNumber || 'Not Assigned'}</td>
                        <td class="border border-gray-300 px-4 py-2 text-center">
                            ${rider.status !== 'Approved' ? `
                                <button onclick="approveRider('${rider._id}')" class="bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700 text-sm font-medium">अप्रूव करें</button>
                            ` : '<span class="text-gray-400 font-medium">Approved</span>'}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-red-500">डेटा लोड करने में त्रुटि हुई।</td></tr>`;
            }
        }

        async function approveRider(id) {
            const scooterNumber = prompt("स्कूटी नंबर दर्ज करें (Enter Scooter Number):", "GGM-SCOOTER-01");
            if (!scooterNumber) return;

            try {
                const response = await fetch(`${API_URL}/api/update-rider`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, status: 'Approved', scooterNumber })
                });
                if (response.ok) {
                    alert("राइडर सफलतापूर्वक अप्रूव कर दिया गया है!");
                    fetchRiders();
                } else {
                    alert("अपडेट करने में विफल रहा।");
                }
            } catch (err) {
                alert("कनेक्शन त्रुटि।");
            }
        }

        fetchRiders();
    </script>
</body>
</html>
