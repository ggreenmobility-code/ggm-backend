<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Green Mobility - Rider Registration & KYC</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="max-w-xl mx-auto mt-10 bg-white p-8 rounded-lg shadow-md mb-10">
        <h2 class="text-2xl font-bold text-green-600 mb-6 text-center">Go Green Mobility - KYC Form</h2>
        <form id="riderForm">
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-1">पूरा नाम (Full Name)</label>
                <input type="text" id="name" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-green-500" placeholder="राइडर का नाम">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-1">मोबाइल नंबर (Phone Number)</label>
                <input type="text" id="phone" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-green-500" placeholder="10 अंकों का मोबाइल नंबर">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-1">पार्टनर (Delivery Partner)</label>
                <select id="partner" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-green-500">
                    <option value="">पार्टनर चुनें</option>
                    <option value="Zepto">Zepto</option>
                    <option value="Blinkit">Blinkit</option>
                    <option value="Instamart">Instamart</option>
                    <option value="Swiggy/Zomato">Swiggy/Zomato</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-1">ड्राइविंग लाइसेंस नंबर (Driving License No.)</label>
                <input type="text" id="drivingLicense" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-green-500" placeholder="DL Number">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-1">आधार नंबर (Aadhaar Number)</label>
                <input type="text" id="aadhaar" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-green-500" placeholder="12 अंकों का आधार नंबर">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-1">पैन कार्ड नंबर (PAN Number)</label>
                <input type="text" id="pan" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-green-500 uppercase" placeholder="PAN Number">
            </div>

            <!-- Guarantor 1 -->
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-1">पहला गारंटर नाम (Guarantor 1 Name)</label>
                <input type="text" id="guarantor1Name" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-green-500" placeholder="पहला गारंटर का नाम">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-1">पहला गारंटर मोबाइल नंबर (Guarantor 1 Phone)</label>
                <input type="text" id="guarantor1Phone" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-green-500" placeholder="मोबाइल नंबर">
            </div>

            <!-- Guarantor 2 -->
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-1">दूसरा गारंटर नाम (Guarantor 2 Name)</label>
                <input type="text" id="guarantor2Name" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-green-500" placeholder="दूसरा गारंटर का नाम">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-1">दूसरा गारंटर मोबाइल नंबर (Guarantor 2 Phone)</label>
                <input type="text" id="guarantor2Phone" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-green-500" placeholder="मोबाइल नंबर">
            </div>

            <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700 transition">केवाईसी सबमिट करें</button>
        </form>
        <div id="message" class="mt-4 text-center font-medium"></div>
    </div>

    <script>
        document.getElementById('riderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const partner = document.getElementById('partner').value;
            const drivingLicense = document.getElementById('drivingLicense').value;
            const aadhaar = document.getElementById('aadhaar').value;
            const pan = document.getElementById('pan').value;
            const guarantor1Name = document.getElementById('guarantor1Name').value;
            const guarantor1Phone = document.getElementById('guarantor1Phone').value;
            const guarantor2Name = document.getElementById('guarantor2Name').value;
            const guarantor2Phone = document.getElementById('guarantor2Phone').value;
            const msgDiv = document.getElementById('message');

            try {
                const response = await fetch('/api/register-rider', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        name, phone, partner, drivingLicense, aadhaar, pan, 
                        guarantor1Name, guarantor1Phone, guarantor2Name, guarantor2Phone 
                    })
                });
                const result = await response.json();
                if (result.success) {
                    msgDiv.className = "mt-4 text-center font-medium text-green-600";
                    msgDiv.innerText = "Rider registered successfully!";
                    document.getElementById('riderForm').reset();
                } else {
                    msgDiv.className = "mt-4 text-center font-medium text-red-600";
                    msgDiv.innerText = "Error: " + result.message;
                }
            } catch (err) {
                msgDiv.className = "mt-4 text-center font-medium text-red-600";
                msgDiv.innerText = "Server connection error.";
            }
        });
    </script>
</body>
</html>
