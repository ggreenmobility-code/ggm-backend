<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Green Mobility - Rider KYC & Verification</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="max-w-xl mx-auto mt-10 bg-white p-8 rounded-lg shadow-md mb-10">
        <h2 class="text-2xl font-bold text-green-600 mb-6 text-center">Go Green Mobility - Rider Verification</h2>

        <!-- Step 1: Phone & OTP Section -->
        <div id="otpSection">
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-1">मोबाइल नंबर (Phone Number)</label>
                <div class="flex gap-2">
                    <input type="text" id="phone" required maxlength="10" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-green-500" placeholder="10 अंकों का मोबाइल नंबर">
                    <button type="button" onclick="sendOtp()" class="bg-green-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-green-700 transition whitespace-nowrap">OTP भेजें</button>
                </div>
            </div>

            <div id="otpInputDiv" class="mb-4 hidden">
                <label class="block text-gray-700 font-medium mb-1">ओटीपी दर्ज करें (Enter OTP)</label>
                <div class="flex gap-2">
                    <input type="text" id="otp" maxlength="4" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-green-500" placeholder="4 अंकों का OTP">
                    <button type="button" onclick="verifyOtp()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-700 transition whitespace-nowrap">वेरीफाई करें</button>
                </div>
            </div>
        </div>

        <!-- Step 2: Main KYC Form (Initially Hidden) -->
        <form id="riderForm" class="hidden mt-6">
            <div class="mb-4 bg-green-50 p-3 rounded text-green-700 font-medium text-center">
                ✓ मोबाइल नंबर वेरिफाइड है: <span id="verifiedPhoneDisplay"></span>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-1">पूरा नाम (Full Name)</label>
                <input type="text" id="name" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-green-500" placeholder="राइडर का नाम">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-1">पार्टनर (Delivery Partner)</label>
                <select id="partner" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-green-500">
                    <option value="">पार्टनर चुनें</option>
                    <option value="Zepto">Zepto</option>
                    <option value="Blinkit">Blinkit</option>
                    <option value="Instamart">Instamart</option>
                    <option value="Swiggy/Zomato">Swiggy/Zomato</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-1">ड्राइविंग लाइसेंस नंबर (Driving License No.)</label>
                <input type="text" id="drivingLicense" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-green-500" placeholder="DL Number">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-1">आधार नंबर (Aadhaar Number)</label>
                <input type="text" id="aadhaar" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-green-500" placeholder="12 अंकों का आधार नंबर">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-1">पैन कार्ड नंबर (PAN Number)</label>
                <input type="text" id="pan" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-green-500 uppercase" placeholder="PAN Number">
            </div>

            <!-- Guarantor 1 -->
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-1">पहला गारंटर नाम (Guarantor 1 Name)</label>
                <input type="text" id="guarantor1Name" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-green-500" placeholder="पहला गारंटर का नाम">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-1">पहला गारंटर मोबाइल नंबर (Guarantor 1 Phone)</label>
                <input type="text" id="guarantor1Phone" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-green-500" placeholder="मोबाइल नंबर">
            </div>

            <!-- Guarantor 2 -->
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-1">दूसरा गारंटर नाम (Guarantor 2 Name)</label>
                <input type="text" id="guarantor2Name" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-green-500" placeholder="दूसरा गारंटर का नाम">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-1">दूसरा गारंटर मोबाइल नंबर (Guarantor 2 Phone)</label>
                <input type="text" id="guarantor2Phone" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-green-500" placeholder="मोबाइल नंबर">
            </div>

            <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700 transition">केवाईसी सबमिट करें</button>
        </form>

        <div id="message" class="mt-4 text-center font-medium"></div>
    </div>

    <script>
        let verifiedPhone = "";

        async function sendOtp() {
            const phone = document.getElementById('phone').value;
            const msgDiv = document.getElementById('message');

            if (phone.length !== 10) {
                alert("कृपया सही 10 अंकों का मोबाइल नंबर दर्ज करें।");
                return;
            }

            try {
                const res = await fetch('/api/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });
                const data = await res.json();
                if (data.success) {
                    msgDiv.className = "mt-4 text-center font-medium text-green-600";
                    msgDiv.innerText = "OTP भेजा गया है! कृपया अपना फोन चेक करें।";
                    document.getElementById('otpInputDiv').classList.remove('hidden');
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("सर्वर त्रुटि।");
            }
        }

        async function verifyOtp() {
            const phone = document.getElementById('phone').value;
            const otp = document.getElementById('otp').value;
            const msgDiv = document.getElementById('message');

            try {
                const res = await fetch('/api/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, otp })
                });
                const data = await res.json();
                if (data.success) {
                    verifiedPhone = phone;
                    document.getElementById('verifiedPhoneDisplay').innerText = phone;
                    document.getElementById('otpSection').classList.add('hidden');
                    document.getElementById('riderForm').classList.remove('hidden');
                    msgDiv.innerText = "";
                } else {
                    msgDiv.className = "mt-4 text-center font-medium text-red-600";
                    msgDiv.innerText = data.message;
                }
            } catch (err) {
                alert("वेरिफिकेशन त्रुटि।");
            }
        }

        document.getElementById('riderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('message');

            const formData = {
                phone: verifiedPhone,
                name: document.getElementById('name').value,
                partner: document.getElementById('partner').value,
                drivingLicense: document.getElementById('drivingLicense').value,
                aadhaar: document.getElementById('aadhaar').value,
                pan: document.getElementById('pan').value,
                guarantor1Name: document.getElementById('guarantor1Name').value,
                guarantor1Phone: document.getElementById('guarantor1Phone').value,
                guarantor2Name: document.getElementById('guarantor2Name').value,
                guarantor2Phone: document.getElementById('guarantor2Phone').value
            };

            try {
                const response = await fetch('/api/register-rider', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                const result = await response.json();
                if (result.success) {
                    msgDiv.className = "mt-4 text-center font-medium text-green-600";
                    msgDiv.innerText = "Rider KYC registered successfully!";
                    setTimeout(() => location.reload(), 2000);
                } else {
                    msgDiv.className = "mt-4 text-center font-medium text-red-600";
                    msgDiv.innerText = "Error: " + result.message;
                }
            } catch (err) {
                msgDiv.className = "mt-4 text-center font-medium text-red-600";
                msgDiv.innerText = "Server connection error.";
            }
        });
    </script>
</body>
</html>
