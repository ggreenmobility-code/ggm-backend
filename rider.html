<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Green Mobility - Rider KYC Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
    <div class="max-w-xl mx-auto my-10 bg-white p-8 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold text-green-600 mb-2 text-center">Go Green Mobility</h2>
        <p class="text-gray-500 text-center mb-6">डिलिवरी पार्टनर ई-स्कूटर रेंटल और केवाईसी फॉर्म</p>

        <form id="riderForm" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 font-medium mb-1">पूरा नाम (Full Name)</label>
                    <input type="text" id="name" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="राजेश कुमार">
                </div>
                <div>
                    <label class="block text-gray-700 font-medium mb-1">मोबाइल नंबर (Phone Number)</label>
                    <input type="tel" id="phone" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="9876543210">
                </div>
            </div>

            <div>
                <label class="block text-gray-700 font-medium mb-1">डिलिवरी पार्टनर (Delivery Partner)</label>
                <select id="partner" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    <option value="Blinkit">Blinkit</option>
                    <option value="Zepto">Zepto</option>
                    <option value="Instamart">Instamart</option>
                </select>
            </div>

            <hr class="my-4 border-gray-200">
            <h3 class="text-lg font-semibold text-gray-800">केवाईसी डॉक्यूमेंट्स (KYC Details)</h3>

            <div>
                <label class="block text-gray-700 font-medium mb-1">ड्राइविंग लाइसेंस नंबर (Driving License No.)</label>
                <input type="text" id="drivingLicense" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="DL-1420110012345">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 font-medium mb-1">आधार नंबर (Aadhaar Number)</label>
                    <input type="text" id="aadhaar" required maxlength="12" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="12 अंक का आधार नंबर">
                </div>
                <div>
                    <label class="block text-gray-700 font-medium mb-1">पैन कार्ड नंबर (PAN Number)</label>
                    <input type="text" id="pan" required maxlength="10" class="w-full px-3 py-2 border rounded-lg uppercase focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="ABCDE1234F">
                </div>
            </div>

            <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition mt-4">केवाईसी सबमिट करें & रजिस्टर करें</button>
        </form>
        <div id="message" class="mt-4 text-center font-medium"></div>
    </div>

    <script>
        const API_URL = "https://ggm-backend-77yp.onrender.com";

        document.getElementById('riderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const partner = document.getElementById('partner').value;
            const drivingLicense = document.getElementById('drivingLicense').value;
            const aadhaar = document.getElementById('aadhaar').value;
            const pan = document.getElementById('pan').value;
            const msgDiv = document.getElementById('message');

            try {
                const response = await fetch(`${API_URL}/api/register-rider`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone, partner, drivingLicense, aadhaar, pan })
                });
                const data = await response.json();
                if (response.ok) {
                    msgDiv.className = "mt-4 text-center font-medium text-green-600";
                    msgDiv.innerText = "केवाईसी और रजिस्ट्रेशन सफलतापूर्वक हो गया!";
                    document.getElementById('riderForm').reset();
                } else {
                    msgDiv.className = "mt-4 text-center font-medium text-red-600";
                    msgDiv.innerText = data.message || "रजिस्ट्रेशन विफल हुआ।";
                }
            } catch (err) {
                msgDiv.className = "mt-4 text-center font-medium text-red-600";
                msgDiv.innerText = "सर्वर से कनेक्ट करने में त्रुटि।";
            }
        });
    </script>
</body>
</html>
