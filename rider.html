<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Green Mobility - Rider Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
    <div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold text-green-600 mb-6 text-center">Go Green Mobility - Rider KYC</h2>
        <form id="riderForm" class="space-y-4">
            <div>
                <label class="block text-gray-700 font-medium mb-1">पूरा नाम (Full Name)</label>
                <input type="text" id="name" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <div>
                <label class="block text-gray-700 font-medium mb-1">मोबाइल नंबर (Phone Number)</label>
                <input type="tel" id="phone" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <div>
                <label class="block text-gray-700 font-medium mb-1">डिलीवरी पार्टनर (Partner)</label>
                <select id="partner" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    <option value="Blinkit">Blinkit</option>
                    <option value="Zepto">Zepto</option>
                    <option value="Instamart">Instamart</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700 transition">रजिस्टर करें (Register)</button>
        </form>
        <div id="message" class="mt-4 text-center font-medium"></div>
    </div>

    <script>
        const API_URL = "https://ggm-backend-77yp.onrender.com";

        document.getElementById('riderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const partner = document.getElementById('partner').value;
            const msgDiv = document.getElementById('message');

            try {
                const response = await fetch(`${API_URL}/api/register-rider`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone, partner })
                });
                const data = await response.json();
                if (response.ok) {
                    msgDiv.className = "mt-4 text-center font-medium text-green-600";
                    msgDiv.innerText = "सफलतापूर्वक रजिस्टर हो गया!";
                    document.getElementById('riderForm').reset();
                } else {
                    msgDiv.className = "mt-4 text-center font-medium text-red-600";
                    msgDiv.innerText = data.message || "रजिस्ट्रेशन विफल हुआ।";
                }
            } catch (err) {
                msgDiv.className = "mt-4 text-center font-medium text-red-600";
                msgDiv.innerText = "सर्वर से कनेक्ट करने में त्रुटि।";
            }
        });
    </script>
</body>
</html>
